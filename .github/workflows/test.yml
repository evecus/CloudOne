name: test
on:
  workflow_dispatch:
    inputs:
      arch:
        description: '选择要编译的架构'
        required: true
        type: choice
        default: 'arm64'
        options:
          - amd64
          - arm64
          - both
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --prefer-offline=false
          npm run build
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - name: Download dependencies
        run: |
          go mod tidy
          go mod download
      - name: Build for Linux amd64
        if: ${{ github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'both' }}
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o cloudone-linux-amd64 .
      - name: Build for Linux arm64
        if: ${{ github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'both' }}
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o cloudone-linux-arm64 .

      - name: Install ARM64 cross compiler
        if: ${{ github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'both' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build for Linux arm64 (cgo=1)
        if: ${{ github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'both' }}
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: go build -ldflags="-s -w" -o cloudone-linux-arm64-cgo .
  
      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: CloudOne test
          prerelease: true # 标记为预发布
          draft: false
          generate_release_notes: false
          files: |
            cloudone-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
