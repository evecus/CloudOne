name: pre-build

on:
  workflow_dispatch: # 点击按钮即触发，无需手动输入版本号

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --prefer-offline=false
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build for Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 
        run: |
          go build -ldflags="-s -w" -o cloudone-linux-arm64 .

      - name: Upload binaries to temporary storage
        uses: actions/upload-artifact@v4
        with:
          name: raw-binaries
          path: |
            cloudone-linux-arm64
          if-no-files-found: error

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: CloudOne test
          prerelease: true # 标记为预发布
          draft: false
          generate_release_notes: false
          files: |
            cloudone-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
