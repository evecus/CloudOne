name: build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号，例如 v1.2.0'
        required: true
        default: 'v1.1.0'

jobs:
  # ===================== 构建二进制 =====================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download

      # ── CGO_ENABLED=0：纯 Go 静态二进制 ──────────────────────
      # 用于 Docker 镜像（Alpine/musl 基础镜像要求静态二进制），
      # 以及不需要走系统 DNS 解析链路（cgo/glibc getaddrinfo）的常规部署场景。
      - name: Build for Linux amd64 (cgo=0)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cloudone-linux-amd64 .

      - name: Build for Linux arm64 (cgo=0)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o cloudone-linux-arm64 .

      # ── CGO_ENABLED=1：动态链接 glibc 的二进制 ────────────────
      # 用于直接部署在宿主机（非容器）且使用透明代理 / fake-ip /
      # systemd-resolved 等场景：这类环境下纯 Go resolver 直连
      # /etc/resolv.conf 里的 nameserver 可能无法被代理正确接管，
      # 而 cgo 版本会走 glibc getaddrinfo/NSS，和 wget/curl 等系统
      # 工具走相同的 DNS 解析路径，能兼容 fake-ip 等场景。
      - name: Build for Linux amd64 (cgo=1)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o cloudone-linux-amd64-cgo .

      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build for Linux arm64 (cgo=1)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: go build -ldflags="-s -w" -o cloudone-linux-arm64-cgo .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudone-binaries
          path: |
            cloudone-linux-amd64
            cloudone-linux-arm64
            cloudone-linux-amd64-cgo
            cloudone-linux-arm64-cgo

  # ===================== 发布 Release =====================
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudone-binaries

      - name: Delete all prereleases and their tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 列出所有标记为 prerelease 的 Release，逐个删除 Release 本身及对应 tag
          gh release list --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' | while read -r tag; do
            echo "Deleting prerelease: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: CloudOne ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            cloudone-linux-amd64
            cloudone-linux-arm64
            cloudone-linux-amd64-cgo
            cloudone-linux-arm64-cgo

  # ===================== 构建并推送 Docker 镜像 =====================
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudone-binaries
          path: .

      - name: Set up QEMU（多平台支持）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudone:${{ github.event.inputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudone:latest
          build-args: |
            VERSION=${{ github.event.inputs.tag }}
